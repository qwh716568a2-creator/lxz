<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>&#30331;&#24405;</title>
    <link rel="stylesheet" type="text/css" href="../../layui/css/layui.css">
    <link rel="stylesheet" type="text/css" href="../../xznstatic/css/public.css">
    <link rel="stylesheet" type="text/css" href="../../xznstatic/css/login.css">
    <link rel="stylesheet" href="../../css/theme.css">
    <style type="text/css">
        .login {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            background-image: url(/tongyongwenjuandiaocha/img/front-img-bg.jpg);
        }

        .login form {
            box-sizing: border-box;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center !important;
            position: inherit;
        }

        .login .title {
            text-align: center;
            box-sizing: border-box;
        }

        .login .form-item {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            box-sizing: border-box;
        }

        .login .form-item input,
        .login .form-label {
            box-sizing: border-box;
        }

        .login .btn-submit {
            display: block;
            box-sizing: border-box;
        }

        .login form p.txt {
            width: 100%;
            margin: 0;
            box-sizing: border-box;
        }

        .l-redio .layui-form-radio {
            margin: 0;
        }

        #loginForm .codes {
            display: none;
        }

        #loginForm .codes input {
            width: calc(100% - 84px);
            height: 44px;
            margin: 0;
            color: #1e90ff;
            font-size: 14px;
            padding: 0 10px;
            border-radius: 0;
            border: 1px solid #1e90ff;
            background-color: #fff;
            box-shadow: 0 0 6px rgba(30, 144, 255, 0);
            outline: none;
        }

        #loginForm .codes .nums {
            width: 84px;
            height: 44px;
            margin: 0;
            color: #333;
            font-size: 16px;
            padding: 0;
            border-radius: 0;
            border: 1px solid #1e90ff;
            border-left: 0;
            background-color: #f5f5f5;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
<div id="app" class="login">
    <form id="loginForm" class="layui-form login-form" :style='{"padding":"20px","boxShadow":"0 0 0px rgba(255,0,0,.8)","borderColor":"rgba(0,0,0,.3)","backgroundColor":"#fff","borderRadius":"20px","borderWidth":"0","width":"400px","borderStyle":"solid","justifyContent":"center","height":"auto"}'>
        <div class="msg-warn hide title main_color" v-if="true" :style='{"padding":"0 10px","boxShadow":"0 0 0px rgba(255,0,0,.8)","margin":"10px auto","borderColor":"rgba(0,0,0,1)","backgroundColor":"rgba(247, 247, 247, 0)","isshow":true,"borderRadius":"8px","borderWidth":"0","width":"auto","lineHeight":"32px","fontSize":"13px","borderStyle":"solid"}'>
            &#20844;&#20849;&#22330;&#25152;&#19981;&#24314;&#35758;&#33258;&#21160;&#30331;&#24405;&#65292;&#20197;&#38450;&#36134;&#21495;&#20002;&#22833;
        </div>

        <div :style='{"padding":"0","boxShadow":"0 0 6px rgba(255,0,0,0)","margin":"0 auto","borderColor":"rgba(0,0,0,1)","backgroundColor":"#fff","borderRadius":"0","borderWidth":"0 0 1px 0","width":"80%","borderStyle":"solid","height":"64px"}' class="form-item">
            <label v-if="false" class="form-label">&#36134;&#21495;</label>
            <input class="main_borderColor layui-input" :style='{"padding":"0 10px","backgroundColor":"#fff","borderRadius":"8px","textAlign":"left","borderWidth":"1px","width":"100%","fontSize":"14px","borderStyle":"solid","height":"44px"}' type="text" name="username" required lay-verify="required" placeholder="&#35831;&#36755;&#20837;&#36134;&#21495;" autocomplete="off">
        </div>

        <div :style='{"padding":"0","boxShadow":"0 0 6px rgba(255,0,0,0)","margin":"0 auto","borderColor":"rgba(0,0,0,1)","backgroundColor":"#fff","borderRadius":"0","borderWidth":"0 0 1px 0","width":"80%","borderStyle":"solid","height":"64px"}' class="form-item">
            <label v-if="false" class="form-label">&#23494;&#30721;</label>
            <input class="main_borderColor layui-input" :style='{"padding":"0 10px","backgroundColor":"#fff","borderRadius":"8px","textAlign":"left","borderWidth":"1px","width":"100%","fontSize":"14px","borderStyle":"solid","height":"44px"}' type="password" name="password" required lay-verify="required" placeholder="&#35831;&#36755;&#20837;&#23494;&#30721;" autocomplete="off">
        </div>

        <div class="form-item codes" :style='{"padding":"0","boxShadow":"0 0 6px rgba(255,0,0,0)","margin":"0 auto","borderColor":"rgba(0,0,0,1)","backgroundColor":"#fff","borderRadius":"0","borderWidth":"0 0 1px 0","width":"80%","borderStyle":"solid","height":"64px"}'>
            <input style="flex: 1;" type="text" id="code" placeholder="&#35831;&#36755;&#20837;&#39564;&#35777;&#30721;">
            <div class="nums" id="nums" style="display:flex;justify-content:center;align-items:center;"></div>
        </div>

        <div :style='{"padding":"0","boxShadow":"0 0 6px rgba(255,0,0,0)","margin":"0 auto","borderColor":"rgba(0,0,0,1)","backgroundColor":"#fff","borderRadius":"0","borderWidth":"0 0 1px 0","width":"80%","borderStyle":"solid","height":"44px"}' class="form-item l-redio">
            <input type="radio" name="role" id="role" value="yonghu" title="&#29992;&#25143;">
        </div>

        <button class="main_backgroundColor layui-btn layui-btn-fluid layui-btn-danger btn-submit" :style='{"padding":"0 10px","boxShadow":"0 0 0px rgba(255,0,0,.5)","margin":"10px auto","borderColor":"#ccc","borderRadius":"8px","borderWidth":"0","width":"60%","fontSize":"14px","borderStyle":"solid","height":"44px"}' lay-submit lay-filter="login">
            &#30331;&#24405;
        </button>

        <p :style='{"color":"rgba(160, 67, 26, 1)","textAlign":"right","fontSize":"12px"}' class="txt">
            <a style="color: inherit;font-size: inherit;" href="javascript:registerClick('yonghu')">&#27880;&#20876;&#29992;&#25143;</a>
        </p>
    </form>
</div>

<script src="../../layui/layui.js"></script>
<script src="../../js/vue.js"></script>
<script src="../../xznstatic/js/element.min.js"></script>
<link rel="stylesheet" href="../../xznstatic/css/element.min.css">
<script src="../../js/config.js?v=rename-20260523"></script>
<script src="../../modules/config.js"></script>
<script src="../../js/utils.js"></script>
<script type="text/javascript">
    var vue = new Vue({
        el: '#app',
        data: {},
        methods: {
            jump: function (url) {
                jump(url);
            }
        }
    });

    var codes = [
        { num: 1, color: '#000', rotate: '10deg', size: '16px' },
        { num: 2, color: '#000', rotate: '10deg', size: '16px' },
        { num: 3, color: '#000', rotate: '10deg', size: '16px' },
        { num: 4, color: '#000', rotate: '10deg', size: '16px' }
    ];

    layui.use(['layer', 'element', 'form', 'http', 'jquery'], function() {
        var layer = layui.layer;
        var form = layui.form;
        var http = layui.http;
        var jquery = layui.jquery;

        function randomString() {
            var len = 4;
            var chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('');
            var colors = '0123456789abcdef'.split('');
            var sizes = ['14', '15', '16', '17', '18'];

            for (var i = 0; i < len; i++) {
                codes[i].num = chars[Math.floor(Math.random() * chars.length)];
                var code = '#';
                for (var j = 0; j < 6; j++) {
                    code += colors[Math.floor(Math.random() * colors.length)];
                }
                codes[i].color = code;
                var rotate = Math.floor(Math.random() * 45);
                if (Math.floor(Math.random() * 2) === 1) {
                    rotate = '-' + rotate;
                }
                codes[i].rotate = 'rotate(' + rotate + 'deg)';
                codes[i].size = sizes[Math.floor(Math.random() * sizes.length)] + 'px';
            }

            var str = '';
            for (var k = 0; k < codes.length; k++) {
                str += '<span style="color:' + codes[k].color + ';transform:' + codes[k].rotate + ';font-size:' + codes[k].size + ';padding:0 3px;display:inline-block">' + codes[k].num + '</span>';
            }
            jquery('#nums').html('').append(str);
        }

        jquery('#nums').click(function() {
            randomString();
        });

        randomString();
        form.render();

        form.on('submit(login)', function(data) {
            data = data.field;
            if (!data.role) {
                layer.msg('\u8bf7\u9009\u62e9\u767b\u5f55\u7528\u6237\u7c7b\u578b', {
                    time: 2000,
                    icon: 5
                });
                return false;
            }

            http.request(data.role + '/login', 'get', data, function(res) {
                layer.msg('\u767b\u5f55\u6210\u529f', {
                    time: 2000,
                    icon: 6
                });
                localStorage.setItem('Token', res.token);
                localStorage.setItem('role', jquery('#role:checked').attr('title'));
                localStorage.setItem('userTable', data.role);
                localStorage.setItem('sessionTable', data.role);
                localStorage.setItem('adminName', data.username);
                http.request(data.role + '/session', 'get', {}, function(sessionRes) {
                    localStorage.setItem('userid', sessionRes.data.id);
                    window.location.href = '../../index.html';
                });
            });
            return false;
        });
    });

    function registerClick(tablename) {
        window.location.href = '../' + tablename + '/register.html?tablename=' + tablename;
    }
</script>
</body>
</html>
