<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据分析 - 通用问卷调查系统</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --primary: #756ff9;
      --primary-dark: #5f58df;
      --accent: #00b894;
      --orange: #f26b4f;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5eaf3;
      --bg: #f3f6fb;
      --panel: #ffffff;
      --sidebar: 255px;
      --header: 50px;
    }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
    }
    .admin-header {
      position: fixed;
      left: 0;
      top: 0;
      right: 0;
      z-index: 10;
      height: var(--header);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      color: #fff;
      background: var(--primary);
      box-shadow: 0 1px 8px rgba(42, 39, 126, .28);
    }
    .system-title {
      font-size: 24px;
      font-weight: 700;
      line-height: var(--header);
      letter-spacing: 0;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 16px;
      font-weight: 700;
    }
    .header-right a {
      color: #fff;
      text-decoration: none;
    }
    .sidebar {
      position: fixed;
      top: var(--header);
      left: 0;
      bottom: 0;
      width: var(--sidebar);
      overflow-y: auto;
      background: #fff;
      border-right: 1px solid #edf1f7;
    }
    .menu-item,
    .menu-group {
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      color: #111;
      text-decoration: none;
      font-size: 16px;
      font-weight: 400;
      cursor: pointer;
    }
    .menu-child {
      height: 62px;
      display: flex;
      align-items: center;
      padding: 0 55px;
      color: #756ff9;
      text-decoration: none;
      font-size: 15px;
      font-weight: 400;
    }
    .menu-child.plain {
      color: #111;
    }
    .menu-hidden {
      display: none;
    }
    .menu-item:hover,
    .menu-group:hover,
    .menu-child:hover {
      color: var(--primary);
      background: transparent;
    }
    .menu-item.active {
      color: #111;
      font-weight: 400;
      background: transparent;
      border-right: 0;
    }
    .menu-arrow {
      color: #c8cfdb;
      font-size: 18px;
      font-family: Arial, sans-serif;
      font-weight: 400;
    }
    .main {
      min-height: 100vh;
      padding: calc(var(--header) + 25px) 30px 38px calc(var(--sidebar) + 30px);
    }
    .breadcrumb {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
      color: #a4a9b6;
      border-bottom: 2px dashed var(--primary);
      font-size: 15px;
      font-weight: 700;
    }
    .breadcrumb span:first-child {
      color: var(--primary);
    }
    .toolbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin: 20px 0 18px;
    }
    .page-title {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0;
    }
    .page-subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    .btn-primary {
      height: 46px;
      min-width: 112px;
      border: 0;
      border-radius: 4px;
      color: #fff;
      background: var(--primary);
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:disabled { opacity: .65; cursor: wait; }
    .cards {
      display: grid;
      grid-template-columns: repeat(5, minmax(140px, 1fr));
      gap: 18px;
      margin-bottom: 22px;
    }
    .card,
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: 0 8px 22px rgba(31, 42, 68, .04);
    }
    .card {
      min-height: 126px;
      padding: 28px 30px;
    }
    .card-label {
      color: #526078;
      font-size: 14px;
      margin-bottom: 18px;
    }
    .card-value {
      font-size: 34px;
      line-height: 1;
      font-weight: 800;
      color: #07152f;
    }
    .card-note {
      margin-top: 14px;
      color: #526078;
      font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(360px, .85fr);
      gap: 20px;
    }
    .panel {
      padding: 22px;
      overflow: hidden;
    }
    .panel h2 {
      margin: 0 0 18px;
      font-size: 19px;
      line-height: 1.3;
      font-weight: 800;
    }
    .trend {
      height: 300px;
      display: flex;
      align-items: flex-end;
      gap: 14px;
      padding: 12px 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .trend-item {
      flex: 1;
      min-width: 0;
      text-align: center;
    }
    .bar-value {
      margin-bottom: 10px;
      color: #5f687c;
      font-size: 13px;
    }
    .bar {
      width: 100%;
      min-height: 8px;
      border-radius: 4px 4px 0 0;
      background: linear-gradient(180deg, var(--primary) 0%, #54c4ef 100%);
    }
    .bar-label {
      margin-top: 9px;
      color: #5f687c;
      font-size: 13px;
      white-space: nowrap;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 13px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }
    th {
      color: #7c8494;
      font-weight: 700;
      background: #fafbff;
    }
    .meter,
    .option-bar {
      height: 8px;
      overflow: hidden;
      border-radius: 4px;
      background: #edf1f7;
    }
    .meter span,
    .option-bar span {
      display: block;
      height: 100%;
      background: var(--accent);
    }
    .question {
      padding-bottom: 16px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    .question:last-child {
      margin-bottom: 0;
      border-bottom: 0;
    }
    .question-title {
      margin-bottom: 7px;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.5;
    }
    .question-meta {
      margin-bottom: 12px;
      color: #526078;
      font-size: 13px;
    }
    .option-row {
      display: grid;
      grid-template-columns: minmax(72px, 160px) 1fr 44px;
      gap: 10px;
      align-items: center;
      margin: 10px 0;
      font-size: 13px;
    }
    .option-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .option-bar span {
      background: var(--orange);
    }
    .empty,
    .error {
      padding: 38px 18px;
      text-align: center;
      color: var(--muted);
      background: #fff;
      border: 1px dashed var(--border);
      border-radius: 4px;
    }
    .error { color: #c0392b; }
    @media (max-width: 1200px) {
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 820px) {
      :root { --sidebar: 0px; }
      .sidebar { display: none; }
      .admin-header { padding: 0 16px; }
      .system-title { font-size: 20px; }
      .header-right { gap: 12px; font-size: 14px; }
      .main { padding-left: 16px; padding-right: 16px; }
      .cards { grid-template-columns: 1fr; }
      .toolbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="system-title">通用问卷调查系统</div>
    <nav class="header-right">
      <span id="userLabel">管理员 admin</span>
      <a href="../../front/index.html">退出到前台</a>
      <a href="./index.html#/login" id="logoutLink">退出登录</a>
    </nav>
  </header>

  <aside class="sidebar">
    <a class="menu-item" href="./index.html#/index">首页</a>
    <div class="menu-group" data-toggle="profile">个人中心 <span class="menu-arrow">⌃</span></div>
    <a class="menu-child menu-profile" href="./index.html#/updatePassword">修改密码</a>
    <a class="menu-child plain menu-profile" href="./index.html#/center">个人信息</a>
    <div class="menu-group" data-toggle="survey">问卷调查管理 <span class="menu-arrow">⌃</span></div>
    <a class="menu-item active menu-survey" href="./analysis.html">数据分析</a>
  </aside>

  <main class="main">
    <div class="breadcrumb">
      <span>首页</span>
      <span>✌</span>
      <span>数据分析</span>
    </div>

    <section class="toolbar">
      <div>
        <h1 class="page-title">数据分析</h1>
        <p class="page-subtitle">统计问卷发布、填写、题目作答与匿名填写情况。</p>
      </div>
      <button id="refreshBtn" class="btn-primary" type="button">刷新数据</button>
    </section>

    <section id="summaryCards" class="cards"></section>

    <section class="grid">
      <div class="panel">
        <h2>近 7 日填写趋势</h2>
        <div id="trend" class="trend"></div>
      </div>

      <div class="panel">
        <h2>题目选项分布</h2>
        <div id="questionStats"></div>
      </div>

      <div class="panel" style="grid-column: 1 / -1;">
        <h2>问卷填写排行</h2>
        <div id="paperStats"></div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      function storageGet(key) {
        var value = localStorage.getItem(key);
        return value ? value.replace('"', '').replace('"', '') : '';
      }

      var token = storageGet('Token');
      var role = storageGet('role') || '管理员';
      var adminName = storageGet('adminName') || 'admin';
      document.getElementById('userLabel').innerText = role + ' ' + adminName;

      if (!token) {
        location.href = './index.html#/login';
        return;
      }

      document.getElementById('logoutLink').onclick = function () {
        localStorage.clear();
      };

      document.querySelectorAll('[data-toggle]').forEach(function (group) {
        group.addEventListener('click', function () {
          var key = group.getAttribute('data-toggle');
          var items = document.querySelectorAll('.menu-' + key);
          var willHide = Array.prototype.some.call(items, function (item) {
            return !item.classList.contains('menu-hidden');
          });
          items.forEach(function (item) {
            item.classList.toggle('menu-hidden', willHide);
          });
          var arrow = group.querySelector('.menu-arrow');
          if (arrow) {
            arrow.innerText = willHide ? '⌄' : '⌃';
          }
        });
      });

      var btn = document.getElementById('refreshBtn');
      btn.addEventListener('click', load);
      load();

      function apiBase() {
        var parts = location.pathname.split('/').filter(Boolean);
        return '/' + (parts[0] || 'tongyongwenjuandiaocha');
      }

      function load() {
        btn.disabled = true;
        fetch(apiBase() + '/analysis/summary', {
          headers: { 'Token': token }
        }).then(function (res) {
          return res.json();
        }).then(function (json) {
          if (json.code === 401) {
            location.href = './index.html#/login';
            return;
          }
          if (json.code !== 0) {
            throw new Error(json.msg || '数据加载失败');
          }
          render(json.data || {});
        }).catch(function (err) {
          document.getElementById('summaryCards').innerHTML = '<div class="error" style="grid-column:1/-1;">' + escapeHtml(err.message || '数据加载失败') + '</div>';
        }).finally(function () {
          btn.disabled = false;
        });
      }

      function render(data) {
        var totals = data.totals || {};
        renderCards([
          ['问卷总数', totals.papers || 0, '已创建问卷'],
          ['题目总数', totals.questions || 0, '题库题目'],
          ['填写记录', totals.responses || 0, '提交次数'],
          ['答题明细', totals.answers || 0, '题目作答'],
          ['匿名填写', totals.anonymousResponses || 0, '无需登录提交']
        ]);
        renderTrend(data.trend || {});
        renderPaperStats(data.paperStats || []);
        renderQuestionStats(data.questionStats || []);
      }

      function renderCards(items) {
        document.getElementById('summaryCards').innerHTML = items.map(function (item) {
          return '<article class="card"><div class="card-label">' + item[0] + '</div><div class="card-value">' + item[1] + '</div><div class="card-note">' + item[2] + '</div></article>';
        }).join('');
      }

      function renderTrend(trend) {
        var keys = Object.keys(trend);
        var values = keys.map(function (key) { return trend[key] || 0; });
        var max = Math.max.apply(null, values.concat([1]));
        document.getElementById('trend').innerHTML = keys.map(function (key) {
          var value = trend[key] || 0;
          var height = Math.max(8, Math.round(value / max * 220));
          return '<div class="trend-item"><div class="bar-value">' + value + '</div><div class="bar" style="height:' + height + 'px"></div><div class="bar-label">' + key + '</div></div>';
        }).join('');
      }

      function renderPaperStats(rows) {
        if (!rows.length) {
          document.getElementById('paperStats').innerHTML = '<div class="empty">暂无问卷数据</div>';
          return;
        }
        document.getElementById('paperStats').innerHTML = '<table><thead><tr><th>问卷名称</th><th>题目数</th><th>填写数</th><th>作答明细</th><th>完成度</th></tr></thead><tbody>' + rows.map(function (row) {
          return '<tr><td>' + escapeHtml(row.name || '未命名问卷') + '</td><td>' + row.questionCount + '</td><td>' + row.responseCount + '</td><td>' + row.answeredCount + '</td><td><div class="meter"><span style="width:' + row.completionRate + '%"></span></div><div style="margin-top:6px;color:#6f7787;font-size:12px;">' + row.completionRate + '%</div></td></tr>';
        }).join('') + '</tbody></table>';
      }

      function renderQuestionStats(rows) {
        if (!rows.length) {
          document.getElementById('questionStats').innerHTML = '<div class="empty">暂无题目作答数据</div>';
          return;
        }
        document.getElementById('questionStats').innerHTML = rows.map(function (row) {
          var options = row.options || {};
          var keys = Object.keys(options);
          var max = Math.max.apply(null, keys.map(function (key) { return options[key] || 0; }).concat([1]));
          var optionHtml = keys.length ? keys.map(function (key) {
            var value = options[key] || 0;
            var width = Math.max(4, Math.round(value / max * 100));
            return '<div class="option-row"><div class="option-name" title="' + escapeAttr(key) + '">' + escapeHtml(key) + '</div><div class="option-bar"><span style="width:' + width + '%"></span></div><div>' + value + '</div></div>';
          }).join('') : '<div class="empty">暂无作答</div>';
          return '<article class="question"><div class="question-title">' + escapeHtml(row.name || '未命名题目') + '</div><div class="question-meta">' + escapeHtml(row.paperName || '') + ' / ' + (row.answerCount || 0) + ' 次作答</div>' + optionHtml + '</article>';
        }).join('');
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char];
        });
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/"/g, '&quot;');
      }
    })();
  </script>
</body>
</html>
